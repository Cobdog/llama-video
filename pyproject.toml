[project]
name = "llama-video"
version = "0.1.3"
description = "Temporal video support for llama.cpp — frame extraction, preprocessing, and captioning service for Qwen3.5 GGUF models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Cobdog"},
]
keywords = ["llama.cpp", "video", "captioning", "qwen", "gguf", "multimodal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
ui = ["gradio>=6.0.0"]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
]

[project.scripts]
llama-video-server = "llama_video.server:main"
llama-video-debug = "llama_video.debug_cli:main"
llama-video-patch = "llama_video.patch_cli:main"
llama-video-ui = "llama_video.webui:main"

[project.urls]
Homepage = "https://github.com/Cobdog/llama-video"
Issues = "https://github.com/Cobdog/llama-video/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llama_video"]

[tool.hatch.build.targets.wheel.force-include]
"patches" = "llama_video/patches"
"scripts/build.sh" = "llama_video/scripts/build.sh"

[tool.hatch.build.targets.sdist]
include = ["src/", "patches/", "scripts/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print (no print statements)
    "LOG", # flake8-logging
]
ignore = [
    "E501",   # line length (handled by formatter)
    "RUF001", # ambiguous unicode in strings (we use x not multiplication sign)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "TCH001", # type-checking imports (not worth the complexity for this project)
    "TCH002", # type-checking imports
    "TCH003", # type-checking imports
]

[tool.ruff.lint.per-file-ignores]
"src/llama_video/debug_cli.py" = ["T20"]  # CLI tool — print is intentional
"src/llama_video/patch_cli.py" = ["T20"]  # CLI tool — print is intentional
"tests/**" = ["T20"]  # Tests can print
"scripts/**" = ["T20", "E402"]  # Scripts can use print and have late imports

[tool.ruff.lint.isort]
known-first-party = ["llama_video"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "gradio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "llama_video.webui"
disallow_untyped_defs = false
disable_error_code = ["no-any-return", "call-arg", "attr-defined"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external resources (video files, reference data, or llama-server)",
    "smoke: end-to-end tests requiring model + server",
    "slow: tests that take more than 10 seconds",
]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["llama_video"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
